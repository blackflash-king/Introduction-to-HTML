<!DOCTYPE html>
<html>
    <body>
        <h2>The Javascript String() Method</h2>
        <p>The string() method can convert numbers to a string</p>
        <p id = "number_result"></p>
        <p id = "string_result"></p>
        <script>
            var x = 70;
            var y = 90;
            document.getElementById("number_result").innerHTML = x+y;
            document.getElementById("string_result").innerHTML = String(y) + String(x);
        </script>
    </body>
</html>
