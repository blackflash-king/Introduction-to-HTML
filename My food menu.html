<!DOCTYPE html>
<html>

<head>
    <title>My food menu</title>
    <style>
        body {
            font-family:Arial;
            background:white;
            padding:30px;
            text-align:center;
        }

        h1 {
            color:rgb(255, 170, 0)
        }

        h1+p {
            background:peachpuff;
            padding:10px 20px;
            border-radius:8px;
            color:skyblue;
            display:inline-block;
        }

     /*Child Selector-styles only direct li children of ul*/
     ul>li {
        list-style: none;
        font-size:25px;
        font-weight:bold;
        color:darkgreen;
        padding:10px 20px;
        margin: auto;
        width:260px;background:lightgreen;
        border-radius: 8px;
        }
      
        /*nth-child-highlights the third item as chef's special*/
        ul li:nth-child(3) {
            background:peachpuff;
            color:white;
        }

        a {
            color:darkorange;
            text-decoration:none;
            font-size:15px;
            margin:0 12px;
            padding:8px 18px;
            border:2px solid darkorange;
            border-radius:8px;
        }

        a:hover {
            background:blue;
            color:white;
        }
     </style>
</head>
    <body>

        
        <h1>My food menu</h1>
        <p>Pick which delicious dish you would like to eat.</p>

        <ul>
            <li>Fried chicken</li>
            <li>Onigiri</li>
            <li>Pizza-
                Chef's Special</li>
            <li>Spaghetti</li>
            <li>Salad</li>
        </ul>

        <p class="desc">All of our food are with time,persision and care. We hope you enjoy your meal.</p>

        <div class="links">
        <a href="#">Order now</a>
        <a href="#">See more</a>
        </div>
    </body>
</html>
