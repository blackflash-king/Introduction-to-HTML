<!DOCTYPE html>
<html>

<head>
    <title>School Club Website</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- STEP 1 - Bootstrap CSS link -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #e4f80d;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #26e449;
                }

        .club-card {
            text-align: center;
            border: 2px solid #43f9ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #1a48b2;
        }

        .club-card h3 {
            color: #f943ff;
        }
    </style>
</head>

<body>

    <h1>My School Clubs</h1>

    <div class="container">

        <div class="row">

            <!-- col-12: full width on mobile
                   col-md-6: half width on tablets
                   col-lg-4: one-third on desktops -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Coding Club</h3>
                    <p>I learn how to create websites, games, and simple apps.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Science Club</h3>
                    <p>I enjoy doing experiments and discovering how things work.</p>
                </div>
            </div>

            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h3>Art Club</h3>
                    <p>I love drawing, painting, and creating colourful designs.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- STEP 5 - Bootstrap JS script -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>

</body>

</html>
