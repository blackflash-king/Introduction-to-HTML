<!DOCTYPE html>
<html>
<head>
    <title>My planet explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Scanning the galaxy...</h1>
    <div class="spinner-border text-primary "></div>
    <div class="spinner-border text-warning "></div>
    <div class="spinner-border text-danger "></div>
    <div class="spinner-border text-success "></div>
    </div>

    <h2 div class="section-title">Planets</h2>
    <div class="row">
    <div class="col-md-4">
    <div class="card">
    <div class="card-body">
    <h3 class="card-title">Earth</h3>
    <p class="card-text">Our home planet- the only one known to have life!</p>
    </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">Mars</h3>
                <p class="card-text">The red planet- a potential future home for humans!</p>
            </div>
        </div>
</body>
</html>
