<!DOCTYPE html>
<html>
<body>
<h2>JavaScript objects and properties </h2>
<p>There are 2 ways to access an object's property</p>
<p>You can use property or ["property"].</p>
<p id = "demo"></p>
<p id = "demo1"></p>
<script>
var person = {
firstname:"Ali",
age:13
}
document.getElementById("demo").innerHTML = person.firstname
document.getElementById("demo1").innerHTML = person["age"]
</script>
</body>
</html>
